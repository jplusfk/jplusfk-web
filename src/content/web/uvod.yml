kniha:
  nadpis: O knize
  text: |-
    Kniha přináší příběhy úsměvné, dojemné i k zamyšlení. Některé autor sám prožil, jiné mu svěřili lidé, které v životě potkal, a o další se postarala fantazie. Povídky doplňují originální ilustrace výtvarníka Petra Herolda, kreslené převážně perem.

    Atmosféru příběhů obohatí hudební doprovod v podobě alba nahraného exkluzivně pro tuto příležitost. Jak na to, najdete v knize.

    Kniha vám může zpříjemnit předvánoční čas a stát se osobním vánočním dárkem pro rodinu nebo přátele.
  foto: /src/assets/uploads/kniha-otevrena.jpg
  foto_alt: Otevřená kniha s textem povídky a celostránkovou ilustrací
