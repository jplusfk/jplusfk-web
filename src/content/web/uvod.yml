pomoc:
  zobrazit: true
  nadpis: Kniha, která pomáhá
  cislo: 10 %
  text: |-
    Koupí knihy se připojíte k podpoře herce, recitátora a úžasného člověka **Alfreda Strejčka**, který před devíti lety téměř úplně ochrnul. Díky své neuvěřitelně silné vůli a vytrvalosti lékařů žije a dál vystupuje, i když na vozíku a se značným omezením pohybu.

    Léčba je však velmi nákladná, a tak vznikla sbírka na jeho léčebné výlohy. Z ceny každého výtisku odešleme 10 % na jeho transparentní účet. Přispět můžete i přímo.
