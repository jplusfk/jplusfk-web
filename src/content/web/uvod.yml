autor:
  zobrazit: true
  nadpis: Kniha s příběhem
  text: |-
    Milí čtenáři, dostává se vám do rukou kniha, na které jsme s láskou pracovali a která má svůj vlastní příběh. Chceme, aby nejen potěšila a pobavila, ale i inspirovala. A také, aby pomáhala.

    Je udělána postaru, s pevnou vazbou potaženou plátnem se slepou ražbou a s ilustracemi kreslenými převážně perem. Takové knihy se dnes dělají opravdu zřídka. Pevná vazba pro nás symbolizuje pevný svazek, rodinu, která by měla držet pospolu. Plátno představuje ubrus, který se dával na stůl ve svátečních časech a u kterého se rodina scházela.

    Dřív se lidé během adventu scházeli a vyprávěli si příběhy. Zkusme si při čtení znovu uvědomit, jak je krásné být s někým, někoho mít, někomu naslouchat. A ilustrace nám připomenou, jak je důležité umět se dívat na věci a lidi kolem sebe s pochopením a zájmem.

    *František Kreuzmann*
