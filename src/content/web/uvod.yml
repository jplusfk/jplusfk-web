soundtrack:
  nadpis: Každá povídka má svou melodii
  text: |-
    Ke každé povídce vznikla vlastní hudební skladba, kterou pro čtenáře nahráli skvělí muzikanti. Album je dalším obohacením knihy a připomínkou doby, kdy se v mnoha rodinách muzicírovalo.

    Pusťte si skladbu ke každému příběhu a nechte adventní večery znít.
