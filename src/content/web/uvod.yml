  koupit_nadpis: Jak knihu získat
  koupit_text: |-
    Knihu si můžete objednat přímo u vydavatelství přes formulář, e-mailem nebo telefonicky. Cena knihy je **550 Kč**.

    **Koupí knihy získáte:**

    - možnost zpříjemnit si předvánoční čas,
    - dárek pro své blízké nebo přátele,
    - odkaz na album s hudebním doprovodem,
    - a připojíte se k podpoře léčebných výloh Alfreda Strejčka.
